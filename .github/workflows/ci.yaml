# See: https://docs.github.com/en/actions/writing-workflows
---
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  feature-isolation:
    name: Feature isolation (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [core, interop, adapters, no-std]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install bare-metal target
        if: matrix.mode == 'no-std'
        run: rustup target add thumbv7em-none-eabihf
      - name: Check feature isolation
        run: python3 .config/check-features.py ${{ matrix.mode }}
  build-ubuntu:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Cargo version
        run: cargo --version
      - name: Build
        run: cargo build
      - name: Build examples
        run: cargo build --examples
      - name: Run tests
        run: cargo test
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Cargo version
        run: cargo --version
      - name: Build
        run: cargo build
      - name: Build examples
        run: cargo build --examples
      - name: Run tests
        run: cargo test
