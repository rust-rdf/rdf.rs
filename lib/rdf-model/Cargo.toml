[package]
name = "rdf-model"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["all", "std"]
all = ["serde", "oxrdf", "datetime", "decimal"]
alloc = ["known-languages/alloc", "serde?/alloc", "serde_json?/alloc", "xsd/alloc"]
std = ["alloc", "dogma/std", "known-languages/std", "serde?/std", "serde_json?/preserve_order", "xsd/std"]
unstable = []
datetime = ["xsd/datetime"]
decimal = ["xsd/decimal"]

# Interoperability:
borsh = ["alloc", "dep:borsh", "xsd/borsh"]
bson = ["std", "dep:bson", "xsd/bson"]
#datafusion = ["dep:rdf-fusion", "xsd/datafusion"]
json-ld = ["std", "dep:json-ld", "xsd/json-ld"]
oxrdf = ["std", "dep:oxrdf", "xsd/oxrdf"]
rudof = ["std", "dep:rudof_rdf", "xsd/rudof"]
serde = ["alloc", "dep:serde", "dep:serde_json", "xsd/serde"]
sophia = ["std", "dep:sophia", "xsd/sophia"]

[dependencies]
dogma.workspace = true
known-languages.workspace = true
xsd.workspace = true

# Interoperability:
borsh = { workspace = true, optional = true }
bson = { workspace = true, optional = true }
json-ld = { workspace = true, optional = true }
oxrdf = { workspace = true, optional = true }
#rdf-fusion = { workspace = true, optional = true }
rudof_rdf = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sophia = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
