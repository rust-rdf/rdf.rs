[package]
name = "rdf-store"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An in-memory storage adapter for RDF.rs knowledge graphs."
#documentation.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["all", "std"]
all = ["oxrdf"]
alloc = ["rdf-model/alloc", "futures/alloc"]
std = ["alloc", "rdf-model/std", "futures/std", "dep:async-stream", "dep:tokio"]
unstable = []

# Integrations:
oxrdf = ["std", "dep:oxrdf", "rdf-model/oxrdf"]

[dependencies]
async-stream = { workspace = true, optional = true }
futures.workspace = true
rdf-model.workspace = true
tokio = { workspace = true, optional = true, features = ["sync"] }

# Integrations:
oxrdf = { workspace = true, optional = true }

[dev-dependencies]
async-stream.workspace = true
##sparql-store.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "store_heap"
required-features = ["std"]
