[package]
name = "rdf-reader-hdt"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An HDT file reader for RDF.rs knowledge graphs."
#documentation.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.lvr]
label = "HDT"
summary = "An HDT file reader for [RDF.rs] knowledge graphs."
features = []

[package.metadata.lvr.examples]
import = "rdf_reader_hdt::HdtReader"

[features]
default = ["all", "std"]
all = []
alloc = ["rdf-format/alloc", "rdf-model/alloc", "rdf-reader/alloc"]
std = ["alloc", "rdf-format/std", "rdf-model/std", "rdf-model/sophia", "rdf-reader/std", "futures/std", "dep:async-stream", "dep:hdt", "dep:tokio", "dep:tokio-util"]
unstable = []

[dependencies]
async-stream = { workspace = true, optional = true }
futures.workspace = true
hdt = { version = "0.7.3", optional = true, features = ["sophia"] }
rdf-format.workspace = true
rdf-model.workspace = true
rdf-reader.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util"] }
tokio-util = { workspace = true, optional = true, features = ["io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros"] }

[[example]]
name = "read_hdt_iter"
required-features = ["std"]

[[example]]
name = "read_hdt_stream"
required-features = ["std"]

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
