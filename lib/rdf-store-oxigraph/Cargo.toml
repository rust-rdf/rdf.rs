[package]
name = "rdf-store-oxigraph"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An Oxigraph storage adapter for RDF.rs knowledge graphs."
#documentation.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.lvr]
label = "Oxigraph"
summary = "An [Oxigraph] storage adapter for **[RDF.rs]** knowledge graphs."
features = ["Implements a scalable, high-performance RDF store backed by [Oxigraph]."]

[package.metadata.lvr.examples]
import = "rdf_store_oxigraph::{OxigraphStore, OxigraphTransaction}"

[features]
default = ["all", "std"]
all = ["rocksdb"]
alloc = ["rdf-model/alloc", "rdf-store/alloc"]
std = ["alloc", "dep:ouroboros", "ouroboros/std", "rdf-model/std", "rdf-store/std", "futures/std", "dep:async-stream", "dep:oxigraph", "dep:send_wrapper"]
unstable = []

# Features:
rocksdb = ["std", "oxigraph/rocksdb"]

[dependencies]
aquamarine.workspace = true
async-stream = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["debug"] }
futures.workspace = true
ouroboros = { workspace = true, optional = true }
oxigraph = { workspace = true, optional = true }
rdf-model.workspace = true
rdf-store.workspace = true
send_wrapper = { workspace = true, optional = true }
thiserror.workspace = true
xsd.workspace = true

[dev-dependencies]
#sparql-store.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "store_oxigraph"
required-features = ["std"]
