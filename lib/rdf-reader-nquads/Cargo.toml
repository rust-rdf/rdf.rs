[package]
name = "rdf-reader-nquads"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An N-Quads file reader for RDF.rs knowledge graphs."
#documentation.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.lvr]
label = "N-Quads"
summary = "An N-Quads file reader for [RDF.rs] knowledge graphs."
features = []

[package.metadata.lvr.examples]
import = "rdf_reader_nquads::NquadsReader"

[features]
default = ["all", "std"]
all = ["oxrdf"]
alloc = ["rdf-format/alloc", "rdf-model/alloc", "rdf-reader/alloc"]
std = ["alloc", "rdf-format/std", "rdf-model/std", "rdf-reader/std", "futures/std", "dep:async-stream", "dep:tokio"]
unstable = []

# Implementations:
oxrdf = ["std", "dep:oxttl", "rdf-format/oxrdf", "rdf-model/oxrdf", "rdf-reader/oxrdf"]
sophia = ["std", "dep:sophia_turtle", "rdf-format/sophia", "rdf-model/sophia", "rdf-reader/sophia"]

[dependencies]
async-stream = { workspace = true, optional = true }
futures.workspace = true
rdf-format.workspace = true
rdf-model.workspace = true
rdf-reader.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util"] }

# Implementations:
oxttl = { workspace = true, optional = true }
sophia_turtle = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros"] }

[[example]]
name = "read_nquads_iter"
required-features = ["oxrdf"]

[[example]]
name = "read_nquads_stream"
required-features = ["oxrdf"]

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
