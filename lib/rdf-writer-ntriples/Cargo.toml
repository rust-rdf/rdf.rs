[package]
name = "rdf-writer-ntriples"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An N-Triples file writer for RDF.rs knowledge graphs."
#documentation.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.lvr]
label = "N-Triples"
summary = "An N-Triples file writer for [RDF.rs] knowledge graphs."
features = []

[package.metadata.lvr.examples]
import = "rdf_writer_ntriples::NtriplesWriter"

[features]
default = ["all", "std"]
all = ["oxrdf"]
alloc = ["rdf-format/alloc", "rdf-model/alloc", "rdf-writer/alloc"]
std = ["alloc", "rdf-format/std", "rdf-model/std", "rdf-writer/std", "futures/std", "dep:tokio"]
unstable = []

# Implementations:
oxrdf = ["std", "dep:oxttl", "rdf-format/oxrdf", "rdf-model/oxrdf", "rdf-writer/oxrdf"]
sophia = ["std", "dep:sophia_turtle", "rdf-format/sophia", "rdf-model/sophia", "rdf-writer/sophia"]

[dependencies]
#async-stream.workspace = true
futures.workspace = true
rdf-format.workspace = true
rdf-model.workspace = true
rdf-writer.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util"] }

# Implementations:
oxttl = { workspace = true, optional = true }
sophia_turtle = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros"] }

[[example]]
name = "write_ntriples"
required-features = ["oxrdf"]

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
